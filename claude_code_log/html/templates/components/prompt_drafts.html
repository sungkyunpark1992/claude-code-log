<!-- 나중에 물어볼 질문 적어두기 -->
<script>
(function () {
    'use strict';

    var prompt = document.getElementById('ccl-live-prompt');
    var panel = document.getElementById('draft-panel');
    var listEl = document.getElementById('draft-list');
    var countEl = document.getElementById('draft-count');
    var badge = document.getElementById('draftCountBadge');
    var pathEl = document.getElementById('draft-path');
    var toggleBtn = document.getElementById('toggleDrafts');
    if (!prompt || !panel) return;

    var saveBtn = prompt.querySelector('.prompt-save-btn');
    var input = prompt.querySelector('.user-input');
    var drafts = [];

    function sessionId() {
        var hdr = document.querySelector('.message.session-header[data-session-id]');
        if (hdr && hdr.dataset.sessionId) return hdr.dataset.sessionId;
        var m = location.pathname.match(/session-([0-9a-fA-F-]{36})\.html/);
        return m ? m[1] : null;
    }
    var sid = sessionId();

    function api(method, body) {
        return fetch('/api/sessions/' + sid + '/drafts', {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: body ? JSON.stringify(body) : undefined
        }).then(function (r) {
            return r.json().then(function (d) { return { ok: r.ok, d: d }; });
        });
    }

    function updateBadge() {
        if (!badge) return;
        badge.textContent = String(drafts.length);
        badge.classList.toggle('visible', drafts.length > 0);
    }

    function render() {
        if (countEl) countEl.textContent = String(drafts.length);
        updateBadge();
        if (!listEl) return;
        if (!drafts.length) {
            listEl.innerHTML = '<div class="draft-empty">저장한 질문이 없습니다.'
                + '<br>입력창의 💾 를 눌러 저장하세요.</div>';
            return;
        }
        listEl.innerHTML = '';
        drafts.forEach(function (d) {
            var row = document.createElement('div');
            row.className = 'draft-item';
            row.dataset.draftId = d.id;

            var when = document.createElement('div');
            when.className = 'draft-item-when';
            when.textContent = d.saved_at;

            var body = document.createElement('div');
            body.className = 'draft-item-body';
            body.textContent = d.text;

            var acts = document.createElement('div');
            acts.className = 'draft-item-acts';
            // 입력창에 되돌려 놓는 것이 이 기능의 목적이다. 눈에 띄게 둔다.
            var put = document.createElement('button');
            put.type = 'button';
            put.className = 'draft-act draft-act-put';
            put.textContent = '입력창에 넣기';
            put.title = '이 질문을 입력창에 넣습니다 (저장본은 그대로 남습니다)';
            var copy = document.createElement('button');
            copy.type = 'button';
            copy.className = 'draft-act';
            copy.textContent = '복사';
            var del = document.createElement('button');
            del.type = 'button';
            del.className = 'draft-act draft-act-del';
            del.textContent = '삭제';

            acts.appendChild(put);
            acts.appendChild(copy);
            acts.appendChild(del);
            row.appendChild(when);
            row.appendChild(body);
            row.appendChild(acts);
            listEl.appendChild(row);
        });
    }

    // 안내 문구가 떠 있는 동안에는 경로로 덮어쓰지 않는다.
    // 목록 조회가 비동기라, 그냥 두면 방금 띄운 문구를 바로 지워 버린다.
    var savedPath = '';
    var flashUntil = 0;

    function showPath() {
        if (pathEl && Date.now() > flashUntil) {
            pathEl.textContent = savedPath;
            pathEl.className = 'draft-panel-hint';
        }
    }

    function load() {
        if (!sid) return Promise.resolve();
        return fetch('/api/sessions/' + sid + '/drafts')
            .then(function (r) { return r.json(); })
            .then(function (d) {
                drafts = d.drafts || [];
                if (d.path) savedPath = d.path;
                showPath();
                render();
            })
            .catch(function () { /* 서버가 잠깐 멈춘 경우 */ });
    }

    function flash(text, kind) {
        if (!pathEl) return;
        flashUntil = Date.now() + 2600;
        pathEl.textContent = text;
        pathEl.className = 'draft-panel-hint ' + (kind || '');
        setTimeout(showPath, 2600);
    }

    // ── 저장 ───────────────────────────────────────────
    if (saveBtn) {
        saveBtn.addEventListener('click', function (e) {
            e.stopPropagation();   // 말풍선 클릭이 다른 동작을 부르지 않게
            if (!sid) return;
            var text = input ? input.value : '';
            if (!text.trim()) {
                openPanel();
                flash('입력창이 비어 있습니다.', 'error');
                return;
            }
            saveBtn.disabled = true;
            api('POST', { action: 'add', text: text })
                .then(function (res) {
                    if (!res.ok) throw new Error(res.d.error || '저장하지 못했습니다');
                    drafts = res.d.drafts || [];
                    if (res.d.path) savedPath = res.d.path;
                    render();
                    openPanel();
                    // 저장했으니 입력창은 비운다 — 남겨두면 실수로 또 보내게 된다.
                    // 되돌리기(Ctrl+Z)가 되도록 지우기 버튼과 같은 방식을 쓴다.
                    if (input) {
                        input.focus();
                        input.select();
                        var undoable = false;
                        try {
                            undoable = document.execCommand('delete');
                        } catch (err) { undoable = false; }
                        if (!undoable) input.value = '';
                        input.style.height = '';
                        input.dispatchEvent(new Event('input', { bubbles: true }));
                    }
                    flash('저장했습니다 — 모두 ' + drafts.length + '건', 'ok');
                })
                .catch(function (err) {
                    openPanel();
                    flash(String(err.message || err), 'error');
                })
                .then(function () { saveBtn.disabled = false; });
        });
    }

    // ── 목록에서의 조작 ────────────────────────────────
    if (listEl) {
        listEl.addEventListener('click', function (e) {
            var row = e.target.closest('.draft-item');
            if (!row) return;
            var id = row.dataset.draftId;
            var draft = null;
            drafts.forEach(function (d) { if (d.id === id) draft = d; });
            if (!draft) return;

            if (e.target.classList.contains('draft-act-put')) {
                if (input) {
                    input.value = draft.text;
                    input.dispatchEvent(new Event('input', { bubbles: true }));
                    input.focus();
                }
                flash('입력창에 넣었습니다.', 'ok');
                return;
            }
            if (e.target.classList.contains('draft-act-del')) {
                if (!window.confirm('이 질문을 지웁니다. 되돌릴 수 없습니다.')) return;
                api('POST', { action: 'delete', id: id }).then(function (res) {
                    if (!res.ok) {
                        flash(res.d.error || '지우지 못했습니다', 'error');
                        return;
                    }
                    drafts = res.d.drafts || [];
                    render();
                    flash('지웠습니다 — 남은 ' + drafts.length + '건', 'ok');
                });
                return;
            }
            if (e.target.textContent === '복사') {
                var done = function () { flash('복사했습니다.', 'ok'); };
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(draft.text).then(done, function () {});
                }
            }
        });
    }

    // ── 패널 열고 닫기 ─────────────────────────────────
    function openPanel() {
        panel.classList.add('open');
        panel.setAttribute('aria-hidden', 'false');
        if (toggleBtn) toggleBtn.classList.add('active');
        // 오른쪽 같은 자리에 붙는 다른 패널들과 겹치지 않게 한다
        ['bookmark-panel', 'export-panel'].forEach(function (id) {
            var other = document.getElementById(id);
            if (!other) return;
            other.classList.remove('open');
            other.setAttribute('aria-hidden', 'true');
        });
        ['toggleBookmarks', 'toggleSelection'].forEach(function (id) {
            var b = document.getElementById(id);
            if (b) b.classList.remove('active');
        });
        document.body.classList.remove('selection-mode');
        load();
    }

    function closePanel() {
        panel.classList.remove('open');
        panel.setAttribute('aria-hidden', 'true');
        if (toggleBtn) toggleBtn.classList.remove('active');
    }

    if (toggleBtn) {
        toggleBtn.addEventListener('click', function () {
            if (panel.classList.contains('open')) closePanel();
            else openPanel();
        });
    }
    var closeBtn = panel.querySelector('.draft-panel-close');
    if (closeBtn) closeBtn.addEventListener('click', closePanel);

    document.addEventListener('click', function (e) {
        if (!panel.classList.contains('open')) return;
        if (panel.contains(e.target)) return;
        if (toggleBtn && toggleBtn.contains(e.target)) return;
        if (e.target.closest && e.target.closest('.prompt-save-btn')) return;
        closePanel();
    });

    // 배지 숫자는 패널을 열지 않아도 보여야 한다
    load();
})();
</script>
